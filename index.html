<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portail de gestion de la patrouille Mont Orford">
  <meta name="theme-color" content="#1b4b72">
  <!-- Home-screen install (assets/manifest.json, icons from tools/make-app-icons.ps1) -->
  <link rel="manifest" href="assets/manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Regis">
  <title>Portail</title>
  
  <!-- Favicon -->
  <link rel="icon" data-brand href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-theme="light" data-module="portal" data-nav="portal" data-page="portal">
  <script src="js/core/config.js"></script>
  <script src="js/core/network.js"></script>
  <script src="js/core/layout.js"></script>
  <!-- Loading Screen -->
  <div id="loading" class="page-loading">
    <div class="loading-spinner"></div>
    <p class="loading-text">Vérification de l'authentification...</p>
  </div>

  <!-- Main Content -->
  <main id="main-content" class="main" style="display: none;">
    <!-- Welcome Section -->
    <section class="welcome-section">
      <h1 class="welcome-title">
        Bienvenue, <span class="welcome-user" data-user-name>-</span>
      </h1>
    </section>

    <h2 class="sr-only">Vos applications</h2>   <!-- level-2 heading for the tiles below (no visible change) -->
    <!-- App Grid -->
    <section class="app-grid" id="app-grid">
      <!-- Cards will be generated dynamically by JavaScript -->
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer footer--simple">
    <div class="footer__content">
      <p class="footer__copyright">© 2026 Regis for Mont Orford</p>
      <p class="footer__version" id="app-version"></p>
    </div>
  </footer>

  <!-- Status Messages Container -->
  <div id="status-messages"></div>

  <!-- Firebase SDK -->

  <!-- Core JS -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/firebase-loader.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/services/badges.js"></script>

  <!-- Page JS -->
  <script>
    // App definitions for the portal
    const portalApps = [
      {
        id: 'regis',
        title: 'Régis gère',
        icon: '🏔️',
        description: 'Le statut de toutes les pistes, montées et remontées au même endroit, avec les recommandations des inspections.',
        url: 'pages/regis-manage.html',
        permission: 'allowRegis',
        permissionDefault: false,
        actionText: 'Accéder à l\'application'
      },
      {
        id: 'jobs',
        title: 'Jobs',
        icon: '🛠️',
        description: 'Les travaux à faire sur les sentiers : créer un job, suivre son état et sa priorité.',
        url: 'pages/jobs.html',
        adminUrl: 'pages/jobs-admin.html',   // an administrator goes straight to Admin: the same list plus priority, done, cancel, reopen
        permission: 'allowJobs',
        permissionDefault: false,
        adminsAlways: true,   // every administrator manages the tasks, whatever their flags
        actionText: 'Accéder à l\'application'
      },
      {
        id: 'inspection',
        title: 'Inspections',
        icon: '🔍',
        description: 'Gestion des inspections et status des pistes, sentiers et abris.',
        url: 'pages/inspection-dashboard.html',
        mobileUrl: 'pages/inspection-dashboard.html?go=a-inspecter',   // on a phone: straight to the "À inspecter" list (the report of a trail is one tap away)
        permission: 'allowInspection',
        permissionDefault: false,
        actionText: 'Accéder à l\'application'
      },
      {
        id: 'maintenance',
        title: 'Entretien',
        icon: '🪏',
        description: 'Rapport de travail quotidien sur les pistes.',
        url: 'pages/maintenance-report.html',
        permission: 'allowMaintenance',
        permissionDefault: false,
        network: 'bike',
        actionText: 'Accéder à l\'application'
      },
      {
        id: 'signalisation',
        title: 'Signalisations',
        icon: '🚧',
        description: 'Gestion de la Signalisation des pistes.',
        url: 'pages/signalisation-report.html',        // mobile default
        desktopUrl: 'pages/signalisation-resume.html', // desktop default (no admin needed)
        permission: 'allowSignalisation',
        permissionDefault: false,
        actionText: 'Accéder à l\'application'
      },
      {
        id: 'infraction',
        title: 'Infractions',
        icon: '🚨',
        description: 'Enregistrement et gestion des infractions constatées sur le terrain.',
        url: 'pages/infraction-report.html',       // mobile default, and desktop default for non-admins
        desktopUrl: 'pages/infraction-admin.html', // desktop default for admins (that page requires admin)
        desktopUrlRequiresAdmin: true,
        permission: 'allowInfraction',
        permissionDefault: false,
        actionText: 'Accéder à l\'application'
      },
      {
        id: 'meteo',
        title: 'Remontées & Météo',
        icon: () => Network.seasonIcon(),   // snowflake in the ski season, sun in the bike season
        description: 'Ouvrir ou fermer les remontées, et relevés météo : température, vent, neige et conditions du jour.',
        url: 'pages/meteo-report.html',
        permission: 'allowMeteo',
        permissionDefault: false,
        feature: 'weather',   // hidden in an activity that does not use the weather (the bike activity, for now)
        actionText: 'Accéder à l\'application'
      },
      {
        id: 'support',
        title: 'Support',
        icon: '📋',
        description: 'Signalez un bug, posez une question ou proposez une amélioration.',
        url: 'pages/support.html',
        permission: null, // Accessible to all authenticated users
        actionText: 'Accéder au support'
      },
      {
        id: 'admin',
        title: 'Administration',
        icon: '⚙️',
        description: 'Gestion des utilisateurs, export de données et paramètres du système.',
        url: 'pages/user-management.html',
        requireAdmin: true, // Special flag for admin-only
        actionText: 'Accéder à l\'administration'
      },
      {
        id: 'status',
        title: 'Statut des sentiers',
        icon: '🗺️',
        description: 'Consultez l\'état actuel des pistes, montées et remontées de la saison, par secteur, avec la météo - page publique.',
        url: 'pages/public-list.html',
        permission: null, // Public
        actionText: 'Voir le statut',
        isPublic: true
      }
    ];

    /**
     * The URL an app card lands on: `desktopUrl` on a computer (when the role allows it -
     * desktopUrlRequiresAdmin guards a desktop target that itself requires admin, e.g.
     * infraction-admin.html, so a non-admin isn't sent somewhere they'd immediately be bounced
     * from), `url` on a phone/small screen or otherwise. Same breakpoint as the app's own
     * responsive CSS (max-width: 768px).
     */
    function landingUrl(app, isAdmin) {
      if (isAdmin && app.adminUrl) return app.adminUrl;   // e.g. Jobs: administrators open the Admin tab
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      if (isMobile && app.mobileUrl) return app.mobileUrl;   // e.g. Inspections: the dashboard already scrolled to "À inspecter"
      if (!app.desktopUrl) return app.url;
      if (isMobile) return app.url;
      if (app.desktopUrlRequiresAdmin && !isAdmin) return app.url;
      return app.desktopUrl;
    }

    /**
     * Generate app cards based on user permissions
     */
    function generateAppCards(userData) {
      const appGrid = document.getElementById('app-grid');
      if (!appGrid) return;

      appGrid.innerHTML = '';

      const isAdmin = userData.role === 'admin' || userData.role === 'system_admin';

      portalApps.forEach(app => {
        // Check admin-only apps
        if (app.requireAdmin && !isAdmin) {
          return; // Skip admin-only cards for non-admins
        }

        // Check permission
        let hasAccess = true;
        if (app.permission) {
          if (app.permissionDefault) {
            // Default true unless explicitly false
            hasAccess = userData[app.permission] !== false;
          } else {
            // Default false unless explicitly true
            hasAccess = userData[app.permission] === true;
          }
        }

        if (app.adminsAlways && isAdmin) hasAccess = true;

        // Some apps only apply to one network (e.g. Entretien is bike-only)
        if (app.network && Network.current() !== app.network) hasAccess = false;
        if (app.feature && !Network.feature(app.feature)) hasAccess = false;
        // Like Entretien (network: 'bike'), Météo follows the activity the person is working in (the winter / ski mode), not today's date

        // Skip card entirely if user doesn't have access (instead of showing disabled)
        if (!hasAccess) return;

        // Create card
        const card = document.createElement('a');
        card.href = landingUrl(app, isAdmin);
        card.className = `app-card app-card--${app.id}`;

        card.innerHTML = `
          <div class="app-card__header">
            <div class="app-card__icon">${typeof app.icon === 'function' ? app.icon() : app.icon}</div>
            <h3 class="app-card__title">${app.title}</h3>
          </div>
          <div class="app-card__body">
            <p class="app-card__description">${app.description}</p>
          </div>
          <div class="app-card__footer">
            <span class="app-card__action">
              ${app.actionText}
              <span>→</span>
            </span>
          </div>
        `;

        appGrid.appendChild(card);
      });
      addRegisBadge(userData);
      addJobsBadge(userData);
      addInspectionMedal(userData);
      recordLastSeen(userData);
    }

    /**
     * On the Inspections tile: the medal of the season (js/services/badges.js). The inspector's own inspections of the season are counted
     * (kept 10 minutes in the session), the level is 5 / 10 / 20 / 50 / 100 and it starts again with each season. Before the first level
     * the tile shows the progress ("3/5"), so the goal is visible. If the count fails (index not created yet) nothing is shown.
     */
    // The last time this person opened the portal, written at most every 12 hours (the Administration > Utilisateurs list uses it to point at accounts that
    // are no longer used). A convenience: never blocks or disturbs the page, and does nothing if the rules do not allow it yet.
    async function recordLastSeen(userData) {
      try {
        const last = userData && userData.lastSeenAt && (userData.lastSeenAt.toDate ? userData.lastSeenAt.toDate() : new Date(userData.lastSeenAt));
        if (last && Date.now() - last.getTime() < 12 * 60 * 60 * 1000) return;
        const user = window.currentUser || (typeof currentUser !== 'undefined' ? currentUser : null);
        if (!user) return;
        await db.collection('inspectors').doc(user.uid).update({ lastSeenAt: firebase.firestore.FieldValue.serverTimestamp() });
      } catch (e) { /* not important */ }
    }

    let medalUser = null;   // remembered so the medal can be drawn again when the portal is shown again (see below)
    async function addInspectionMedal(userData) {
      medalUser = userData;
      const card = document.querySelector('.app-card--inspection');
      if (!card || userData.allowInspection !== true || typeof Badges === 'undefined') return;
      const user = window.currentUser || (typeof currentUser !== 'undefined' ? currentUser : null);
      const summary = await Badges.summary(db, user && user.uid, Network.current(), { userData });   // the count is kept in the profile (userData.medals)
      const current = document.querySelector('.app-card--inspection');   // the cards may have been drawn again meanwhile
      if (!current) return;
      const old = current.querySelector('.app-card__medal');
      if (old) old.remove();
      if (!summary) return;
      const medal = document.createElement('span');
      // Out of season (e.g. the bike activity in November) the medal is the one of the season that just ended: dimmed, with "saison terminée"
      const ended = !(summary.range && summary.range.active);
      medal.className = 'app-card__medal' + (summary.level ? ' app-card__medal--' + summary.level.id : ' app-card__medal--none') + (ended ? ' app-card__medal--ended' : '');
      medal.title = Badges.describe(summary);
      medal.setAttribute('aria-label', medal.title);
      // The medal and the number reached; before the first level a star and the goal ("/5"), which the phone layout drops to keep the tile small
      const goal = summary.level || ended ? '' : `<span class="app-card__medal-goal">/${summary.next.at}</span>`;
      const over = ended ? '<span class="app-card__medal-ended"><span class="app-card__medal-ended-word">saison </span>terminée</span>' : '';
      medal.innerHTML = `<span>${summary.level ? summary.level.icon : '☆'}</span><span>${summary.count}</span>${goal}${over}`;
      current.querySelector('.app-card__header').appendChild(medal);
    }

    // The portal is often NOT reloaded when you come back to it (the back button, or the app opened from the home screen, which keeps the page in
    // memory): draw the medal again then, so that an inspection just made is counted. Cheap: the count is kept 10 minutes in the session, and a
    // saved report empties it (Badges.forget), so only then is something read (the last week).
    window.addEventListener('pageshow', e => { if (e.persisted && medalUser) addInspectionMedal(medalUser); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && medalUser) addInspectionMedal(medalUser); });

    /**
     * On the Jobs tile: how many jobs are still open (à faire / en cours) after more than APP_CONFIG.jobs.oldDays days (14). An orange number; nothing when there
     * is none. ONE read of the jobs of the activity when the portal opens, for the people who see the tile (administrators, or the Jobs permission).
     */
    async function addJobsBadge(userData) {
      const card = document.querySelector('.app-card--jobs');
      if (!card) return;
      try {
        const days = (APP_CONFIG.jobs && APP_CONFIG.jobs.oldDays) || 14, limit = Date.now() - days * 86400000;
        const snap = await db.collection('jobs').where('network', '==', Network.current()).get();
        let old = 0;
        snap.forEach(doc => {
          const j = doc.data(), created = j.createdAt && (j.createdAt.toDate ? j.createdAt.toDate() : new Date(j.createdAt));
          if (Network.matches(j) && (j.status === 'todo' || j.status === 'doing') && created && !isNaN(created) && created.getTime() < limit) old++;
        });
        const current = document.querySelector('.app-card--jobs');
        const prev = current && current.querySelector('.app-card__badge');
        if (prev) prev.remove();
        if (!old || !current) return;
        const badge = document.createElement('span');
        badge.className = 'app-card__badge app-card__badge--old';
        badge.textContent = old;
        badge.title = old + (old > 1 ? ' jobs ouverts' : ' job ouvert') + ' depuis plus de ' + days + ' jours, pas encore terminé' + (old > 1 ? 's' : '');
        badge.setAttribute('aria-label', badge.title);
        current.querySelector('.app-card__header').appendChild(badge);
      } catch (e) { console.warn('Jobs: the old jobs could not be counted.', e); }
    }

    /**
     * On the Régis gère tile: how many recommendations of the inspections wait for a decision. ONE read of the trails when the portal opens
     * (only for the people who manage); the portal is not a live page: the count is as of the opening, Régis gère itself is live.
     */
    async function addRegisBadge(userData) {
      const card = document.querySelector('.app-card--regis');
      if (!card || userData.allowRegis !== true) return;
      try {
        const snap = await db.collection('trails').get();
        let waiting = 0;
        snap.forEach(doc => {
          const t = doc.data();
          if (Network.matches(t) && t.archived !== true && t.recommendation && t.recommendation.status && t.recommendation.status !== t.status) waiting++;
        });
        const current = document.querySelector('.app-card--regis');   // the cards may have been drawn again meanwhile
        const old = current && current.querySelector('.app-card__badge');
        if (old) old.remove();
        if (!waiting || !current) return;
        const badge = document.createElement('span');
        badge.className = 'app-card__badge';
        badge.title = waiting + ' recommandation' + (waiting > 1 ? 's' : '') + ' à traiter';
        badge.textContent = waiting;
        current.querySelector('.app-card__header').appendChild(badge);
      } catch (e) { console.warn('Régis gère: the recommendations could not be counted.', e); }
    }

    /**
     * Initialize the portal page
     */
    function initPortal() {
      // Set version
      const versionEl = document.getElementById('app-version');
      if (versionEl) {
        versionEl.textContent = `v${APP_CONFIG.version}`;
      }

      // Check auth and generate cards
      checkAuthStatus({
        requireAuth: true,
        onAuthenticated: (userData) => {
          generateAppCards(userData);
        }
      });
    }

    // Initialize when DOM is ready
    onFirebaseReady( initPortal);
  </script>
</body>
</html>
