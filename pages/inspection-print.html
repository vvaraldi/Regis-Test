<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fiche des inspections">
  <meta name="theme-color" content="#f59e0b">
  <title>Fiche des inspections</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* The sheet page holds ONLY what is printed: no portal header, menus or footer (layout.js is not loaded) */
    body { background: #fff; margin: 0; }
    body::before { display: none; }   /* the portal's triangle pattern */
    .sheet { max-width: 1000px; margin: 0 auto; padding: 1.25rem; }
    .sheet-head__right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; justify-content: flex-end; }
    .sheet-close-btn, .sheet-pdf-btn { padding: 0.7rem 1.2rem; border-radius: 999px; font-size: 1rem; font-weight: 600; cursor: pointer; white-space: nowrap; background: #fff; }
    .sheet-close-btn { border: 1px solid var(--theme-border); color: var(--theme-text, #1f2937); }
    .sheet-pdf-btn { border: 2px solid var(--theme-accent, #d97706); color: var(--theme-accent, #d97706); }
    .sheet-hint { max-width: 1000px; margin: 0 auto 0.5rem; padding: 0.5rem 1.25rem 0; font-size: 0.85rem; color: var(--theme-text-secondary); text-align: right; }
    .sheet-print-btn { padding: 0.7rem 1.4rem; border-radius: 999px; border: 0; background: var(--theme-accent, #d97706); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
    .sheet-print-btn:hover { filter: brightness(1.08); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 2px solid var(--theme-border); padding-bottom: 0.75rem; margin-bottom: 0.75rem; }
    .sheet-head h1 { font-size: 1.6rem; margin: 0; }
    .sheet-logo { max-height: 56px; max-width: 160px; width: auto; object-fit: contain; }
    .sheet-filters { font-size: 0.875rem; margin: 0 0 1rem; display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
    .sheet-filters b { font-weight: 600; }
    .sector-title { font-size: 1rem; font-weight: 700; margin: 1.25rem 0 0.25rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--theme-border); }
    /* photos (one column, the photos one under the other) | trail and comment (the wide column) | state and date */
    .sign { display: grid; grid-template-columns: 236px minmax(0, 1fr) 7.5rem; gap: 0.9rem; padding: 0.7rem 0; border-bottom: 1px dashed var(--theme-border); break-inside: avoid; page-break-inside: avoid; }
    .sign__photos { display: flex; flex-direction: column; gap: 0.5rem; }
    .sign__photo { width: 228px; font-size: 0.75rem; }
    .sign__thumb { display: block; width: 228px; height: 228px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--theme-border); cursor: zoom-in; }
    .sign__nophoto { font-size: 0.8rem; color: var(--theme-text-secondary); }
    .sign .photo-location { margin-top: 0.2rem; font-size: 0.75rem; line-height: 1.3; }
    .sign .photo-location a { color: var(--theme-accent); margin-right: 0.4rem; white-space: nowrap; }
    .sign__trail { font-weight: 600; font-size: 1.05rem; }
    .sign__comment { font-size: 0.95rem; white-space: pre-wrap; margin-top: 0.25rem; overflow-wrap: anywhere; }
    .sign__side { text-align: right; font-size: 0.85rem; }
    .sign__date { margin-top: 0.3rem; color: var(--theme-text-secondary); white-space: nowrap; }
    .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.5rem; border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 600; }
    .badge--good { background: #d1fae5; color: #065f46; }
    .badge--warning { background: #fef3c7; color: #92400e; }
    .badge--critical { background: #fee2e2; color: #991b1b; }
    .badge--unknown { background: #e5e7eb; color: #374151; }
    .sign__lines { font-size: 0.9rem; margin-top: 0.3rem; }
    .sign__lines div + div { margin-top: 0.1rem; }
    .sign__label { color: var(--theme-text-secondary); }
    .sign__tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
    .sign__tag { border: 1px solid var(--theme-border); border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.8rem; }
    .sign__kind { font-size: 0.8rem; font-weight: 400; color: var(--theme-text-secondary); margin-left: 0.4rem; }
    .sheet-empty { text-align: center; padding: 2rem 0; color: var(--theme-text-secondary); }
    .sheet-total { margin: 0.75rem 0 0; font-size: 0.8125rem; color: var(--theme-text-secondary); }
    @media (max-width: 700px) {
      .sheet { padding: 0.75rem; }
      .sign { grid-template-columns: minmax(0, 1fr) 6rem; }
      .sign__photos { grid-column: 1 / -1; order: 3; flex-direction: row; flex-wrap: wrap; }
      .sign__photo, .sign__thumb { width: min(228px, 100%); }
      .sign__thumb { height: auto; aspect-ratio: 1; }
    }

    /* On paper: just the sheet; photos stay big, a sign is never cut across two pages */
    @media print {
      .no-print { display: none !important; }
      .sheet { max-width: none; padding: 0; }
      .sign .photo-location { display: none; }
      .sign { grid-template-columns: 200px minmax(0, 1fr) 6.5rem; }
      .sign__photo { width: 192px; }
      .sign__thumb { width: 192px; height: 192px; border-color: #999; }
      .sector-title { break-after: avoid; page-break-after: avoid; }
      @page { margin: 12mm; }
    }
    /* Photo-location pop-up (js/services/photo-map-modal.js builds its own markup; these are its rules) */
    .detail-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
    .detail-modal.show { display: flex; }
    .detail-modal__content { background: var(--theme-surface); border-radius: var(--radius-lg); max-width: 600px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
    .detail-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-bottom: 1px solid var(--theme-border); }
    .detail-modal__title { font-size: 1.125rem; font-weight: 600; }
    .detail-modal__close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--theme-text-secondary); }
    .detail-modal__body { padding: 1rem; overflow-y: auto; flex: 1; }
    .detail-modal__footer { display: flex; gap: 1rem; justify-content: flex-end; padding: 1rem; border-top: 1px solid var(--theme-border); }
  </style>
</head>
<body data-theme="light" data-module="inspection" data-page="inspection-print">
  <script src="../js/core/config.js"></script>
  <script src="../js/core/network.js"></script>
  <script src="../js/core/kind.js"></script>
  <div id="loading" class="page-loading"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>

  <main id="main-content" style="display:none;">
    <article class="sheet" id="sheet">
      <header class="sheet-head">
        <h1>Inspections</h1>
        <div class="sheet-head__right">
          <button type="button" class="sheet-close-btn no-print" id="close-btn" title="Fermer cette fiche et revenir">✕ Fermer</button>
          <button type="button" class="sheet-print-btn no-print" id="print-btn" title="Imprimer cette fiche">🖨️ Imprimer</button>
          <button type="button" class="sheet-pdf-btn no-print" id="pdf-btn" title="Enregistrer la fiche en PDF (ouvre l'impression : choisir « Enregistrer en PDF »)">📄 PDF</button>
          <img class="sheet-logo" id="sheet-logo" alt="Mont Orford">
        </div>
      </header>
      <p class="sheet-hint no-print" id="pdf-hint" hidden>Dans la fenêtre qui s'ouvre, choisissez « Enregistrer en PDF » comme imprimante, puis « Enregistrer ».</p>
      <p class="sheet-filters" id="sheet-filters"></p>
      <div id="sheet-list"><p class="sheet-empty">Chargement...</p></div>
      <p class="sheet-total" id="sheet-total"></p>
    </article>
  </main>

  <script src="../js/core/utils.js"></script>
  <script src="../js/core/period-filter.js"></script>
  <script src="../js/core/theme.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/firebase-loader.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/services/photo-service.js"></script>
  <script src="../js/services/map-service.js"></script>
  <script src="../js/services/photo-map-modal.js"></script>
  <script src="../js/services/trail-service.js"></script>
  <script src="../js/services/status-service.js"></script>

  <script>
    // The filters come in the address, from the "Fiche à imprimer" button of Inspections > Gestion:
    //   ?period=season|all|today|week|month|custom&start=&end=&type=trail|shelter&location=<id>&inspector=<name>&q=<text>
    // No weather, no hour, and no inspector name on the sheet (an inspector filter is only said to be on).
    const addressParams = new URLSearchParams(location.search);
    const paramPeriod = addressParams.has('period') ? PeriodFilter.fromParams(addressParams) : { value: 'season', start: '', end: '' };   // like the Gestion page
    const paramType = ['trail', 'shelter'].includes(addressParams.get('type')) ? addressParams.get('type') : 'all';
    const paramLocation = addressParams.get('location') || '';
    const paramInspector = addressParams.get('inspector') || '';
    const paramSearch = (addressParams.get('q') || '').trim();

    const trails = new Map();      // this activity's trails of the view shown
    const shelters = new Map();
    let inspections = [];
    let loadedFull = false;

    const dayText = d => d ? d.toLocaleDateString('fr-CA', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
    const CONDITION_CLASS = { good: 'badge--good', warning: 'badge--warning', critical: 'badge--critical' };
    const SNOW = { good: 'Bonnes', warning: 'Moyennes', critical: 'Mauvaises' };
    const CLEAN = { good: 'Propre', warning: 'Moyen', critical: 'Sale' };
    const ACCESS = { good: 'Dégagé', warning: 'Partiellement obstrué', critical: 'Bloqué' };

    // Does the period reach back before the season start (all that is read at first)?
    function periodNeedsFull() {
      return PeriodFilter.matches(new Date(Network.seasonStart().getTime() - 86400000), paramPeriod);
    }

    function initInspectionPrint() {
      checkAuthStatus({
        requireAuth: true,
        requiredPermission: 'allowInspection',
        onAuthenticated: async () => {
          const logo = document.getElementById('sheet-logo');
          if (BRANDING.logoImage) logo.src = siteUrl(BRANDING.logoImage); else logo.remove();
          document.getElementById('print-btn').addEventListener('click', () => window.print());
          // PDF: the browser's own printing can save a PDF; the hint says how, and the page title becomes the file name
          document.getElementById('pdf-btn').addEventListener('click', () => { document.getElementById('pdf-hint').hidden = false; window.print(); });
          // Close: a tab opened by the button closes itself; if the browser refuses (page opened by hand), go back to the list
          document.getElementById('close-btn').addEventListener('click', () => { window.close(); setTimeout(() => { if (!window.closed) goBackToList(); }, 300); });
          await MapService.load();
          await load();
        }
      });
    }

    async function load() {
      const list = document.getElementById('sheet-list');
      try {
        trails.clear(); shelters.clear();
        const trailsSnap = await db.collection('trails').get();
        trailsSnap.forEach(doc => { const t = doc.data(); if (Network.matches(t) && TrailService.isInspected(t) && TrailService.kindOf(t) === Kind.current()) trails.set(doc.id, t); });
        if (Network.feature('shelters')) {
          const sheltersSnap = await db.collection('shelters').get();
          sheltersSnap.forEach(doc => { if (Network.matches(doc.data())) shelters.set(doc.id, doc.data()); });
        }
        const names = new Map();
        const inspSnap = await db.collection('inspectors').get();
        inspSnap.forEach(doc => names.set(doc.id, doc.data().name));

        // like the Gestion page: the current season only, the whole history when the period reaches before it
        loadedFull = periodNeedsFull();
        const since = loadedFull ? null : firebase.firestore.Timestamp.fromDate(Network.seasonStart());
        const read = name => (since ? db.collection(name).where('date', '>=', since).orderBy('date', 'desc') : db.collection(name)).get();
        const when = d => (d.date && d.date.toDate ? d.date.toDate() : new Date(d.date));
        const trailDocs = (await read('trail_inspections')).docs.filter(doc => trails.has(doc.data().trail_id));
        const shelterDocs = shelters.size ? (await read('shelter_inspections')).docs.filter(doc => shelters.has(doc.data().shelter_id)) : [];
        inspections = [
          ...trailDocs.map(doc => { const d = doc.data(); return { id: doc.id, type: 'trail', locationId: d.trail_id, location: (trails.get(d.trail_id) || {}).name || 'Sentier inconnu', date: when(d), inspector: d.inspector_name || names.get(d.inspector_id) || 'Inconnu', condition: d.condition || 'unknown', trail_status: d.trail_status, snow_condition: d.snow_condition, issues: d.issues || [], notes: d.notes || '', photos: PhotoService.photosFrom(d), raw: d }; }),
          ...shelterDocs.map(doc => { const d = doc.data(); return { id: doc.id, type: 'shelter', locationId: d.shelter_id, location: (shelters.get(d.shelter_id) || {}).name || 'Abri inconnu', date: when(d), inspector: d.inspector_name || names.get(d.inspector_id) || 'Inconnu', condition: d.condition || 'unknown', cleanliness: d.cleanliness, accessibility: d.accessibility, cleanliness_details: d.cleanliness_details, accessibility_details: d.accessibility_details, issues: d.issues || [], notes: d.notes || '', photos: PhotoService.photosFrom(d), raw: d }; })
        ];
        render();
      } catch (e) {
        console.error('Error loading inspections:', e);
        list.innerHTML = '<p class="sheet-empty" style="color:#ef4444;">Erreur de chargement</p>';
      }
    }

    function selected() {
      const q = paramSearch.toLowerCase();
      return inspections.filter(i => {
        if (paramType !== 'all' && i.type !== paramType) return false;
        if (paramLocation && i.locationId !== paramLocation) return false;
        if (paramInspector && i.inspector !== paramInspector) return false;
        if (!PeriodFilter.matches(i.date, paramPeriod)) return false;
        if (q && ![i.location, i.inspector, i.notes, ...(i.issues || [])].join(' ').toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) =>
        (a.type === b.type ? 0 : a.type === 'trail' ? -1 : 1) ||            // trails, then shelters
        a.location.localeCompare(b.location, 'fr') ||
        (b.date - a.date));                                                 // the most recent first
    }

    function filtersHtml() {
      const place = paramLocation ? ((trails.get(paramLocation) || shelters.get(paramLocation) || {}).name || 'Lieu choisi') : 'Tous';
      const parts = [
        ['Période', PeriodFilter.label(paramPeriod)],
        ['Type', { all: 'Tous', trail: 'Sentiers', shelter: 'Abris' }[paramType]],
        ['Lieu', place]
      ];
      if (paramInspector) parts.push(['Inspecteur', 'un seul (filtré)']);          // the name is not printed
      if (paramSearch) parts.push(['Recherche', '« ' + paramSearch + ' »']);
      if (typeof Kind !== 'undefined' && Kind.ids().length > 1) parts.unshift(['Vue', TrailService.kindLabel(Kind.current())]);
      return parts.map(([k, v]) => `<span>${escapeHtml(k)} : <b>${escapeHtml(v)}</b></span>`).join('');
    }

    function linesHtml(i) {
      const line = (label, value) => `<div><span class="sign__label">${escapeHtml(label)} :</span> ${escapeHtml(value)}</div>`;
      const out = [];
      if (i.type === 'trail') {
        if (i.trail_status) out.push(line(i.raw && i.raw.status_is_recommendation ? 'Statut recommandé' : 'Statut du sentier', i.trail_status === 'open' ? 'Ouvert' : 'Fermé'));
        const outcome = StatusService.outcomeText(i.raw);   // what the manager did with the recommendation (Régis gère)
        if (outcome) out.push(line('Suite donnée', outcome));
        if (i.snow_condition) out.push(line('Conditions de neige', SNOW[i.snow_condition] || i.snow_condition));
      } else {
        if (i.cleanliness) out.push(line('Propreté', CLEAN[i.cleanliness] || i.cleanliness));
        if (i.accessibility) out.push(line('Accessibilité', ACCESS[i.accessibility] || i.accessibility));
        if (i.cleanliness_details) out.push(line('Détails propreté', i.cleanliness_details));
        if (i.accessibility_details) out.push(line('Détails accessibilité', i.accessibility_details));
      }
      return out.length ? `<div class="sign__lines">${out.join('')}</div>` : '';
    }

    function inspectionHtml(i) {
      const preferredMap = i.type === 'trail' ? TrailService.geoMapIdOf(trails.get(i.locationId)) : null;
      const photosHtml = i.photos.length
        ? i.photos.map(p => `<div class="sign__photo"><img class="sign__thumb" src="${escapeHtml(p.url)}" alt="Photo" loading="lazy" onclick="window.open(this.src, '_blank')">${PhotoMapModal.locationLinks(p, { collection: i.type === 'trail' ? 'trail_inspections' : 'shelter_inspections', docId: i.id, record: i.raw, preferredMap, onChanged: load })}</div>`).join('')
        : '<span class="sign__nophoto">Aucune photo</span>';
      const tags = (i.issues || []).length ? `<div class="sign__tags">${i.issues.map(t => `<span class="sign__tag">⚠️ ${escapeHtml(t)}</span>`).join('')}</div>` : '';
      return `<div class="sign" data-id="${escapeHtml(i.id)}">
        <div class="sign__photos">${photosHtml}</div>
        <div><div class="sign__trail">${escapeHtml(i.location)}<span class="sign__kind">${i.type === 'trail' ? 'Sentier' : 'Abri'}</span></div>${linesHtml(i)}${tags}${i.notes ? `<div class="sign__comment">${escapeHtml(i.notes)}</div>` : ''}</div>
        <div class="sign__side"><span class="badge ${CONDITION_CLASS[i.condition] || 'badge--unknown'}">${escapeHtml(TrailService.conditionText(i.condition, false))}</span><div class="sign__date">${escapeHtml(dayText(i.date))}</div></div>
      </div>`;
    }

    function render() {
      document.getElementById('sheet-filters').innerHTML = filtersHtml();
      const rows = selected();
      const list = document.getElementById('sheet-list');
      if (!rows.length) {
        list.innerHTML = '<p class="sheet-empty">Aucune inspection pour ces filtres.</p>';
      } else {
        let html = '', last = null;
        rows.forEach(i => {
          if (i.type !== last) { html += `<h2 class="sector-title">${i.type === 'trail' ? 'Sentiers' : 'Abris'}</h2>`; last = i.type; }
          html += inspectionHtml(i);
        });
        list.innerHTML = html;
      }
      document.title = 'Inspections ' + new Date().toISOString().slice(0, 10);   // the default name of a saved PDF
      document.getElementById('sheet-total').textContent =`${rows.length} inspection(s) · fiche du ${dayText(new Date())}`;
    }

    // where \"Fermer\" leads when the browser will not close the tab (the page was opened by hand)
    function goBackToList() { location.href = 'inspection-history.html'; }

    onFirebaseReady(initInspectionPrint);
  </script>
</body>
</html>
