<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Régis gère : le statut de toutes les pistes, montées et remontées">
  <meta name="theme-color" content="#0f766e">
  <title>Régis gère</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* The dashboard of the mountain manager: every trail and lift by sector, one click to switch its status */
    .rg-mountain { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; justify-content: space-between; margin-bottom: 1rem; }
    .rg-counts { display: flex; gap: 0.5rem 1rem; flex-wrap: wrap; align-items: center; font-size: 0.95rem; }
    .rg-count { white-space: nowrap; }
    .rg-count--open strong { color: #15803d; }
    .rg-count--closed strong { color: #b91c1c; }
    .rg-count--reco strong { color: var(--theme-accent-dark, #115e59); }
    .rg-tools { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .rg-all { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
    .rg-filter { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; cursor: pointer; }

    /* the round buttons: red = close everything, green = open everything */
    .rg-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); cursor: pointer; padding: 0; flex: none; transition: transform 0.1s, box-shadow 0.1s; }
    .rg-dot:hover { transform: scale(1.12); box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
    .rg-dot:disabled { opacity: 0.5; cursor: wait; }
    .rg-dot--open { background: #16a34a; }
    .rg-dot--closed { background: #dc2626; }
    .rg-dots { display: flex; gap: 0.5rem; align-items: center; }

    /* the groups (Montées, Descentes), each a grid of sector boxes: three per line on a wide screen */
    .rg-group-block { margin-bottom: 0.75rem; }
    .rg-group-block__title { margin: 0 0 0.3rem; font-size: 1.1rem; }
    /* four boxes per line on a wide screen (the page may be up to 1600 px wide), three, two, then one on smaller screens */
    main.main { max-width: 1600px; }
    .rg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; align-items: start; }
    @media (max-width: 1300px) { .rg-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 1000px) { .rg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .rg-grid { grid-template-columns: 1fr; } .rg-rows { grid-template-columns: 1fr; } }
    .rg-sector { margin: 0; }
    /* Montées and Remontées take all the width: the rows of a box side by side, as many as fit */
    .rg-grid--wide { grid-template-columns: 1fr; }
    .rg-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); column-gap: 1.25rem; }
    .rg-sector .section-card__header { padding: 0.3rem 0.75rem; min-height: 0; }
    .rg-sector .section-card__body { padding: 0.1rem 0.75rem 0.3rem; }
    .rg-link { background: none; border: 0; padding: 0; color: var(--theme-accent-dark, #115e59); text-decoration: underline; cursor: pointer; font-size: inherit; }
    .rg-filter-box { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .rg-filter-box label { display: inline-flex; align-items: center; gap: 0.3rem; cursor: pointer; font-size: 0.9rem; }

    /* the last inspection of a trail, in a window */
    .rg-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
    .rg-modal.show { display: flex; }
    .rg-modal__content { background: var(--theme-surface); border-radius: var(--radius-lg, 12px); max-width: 600px; width: 100%; max-height: 90vh; overflow: auto; }
    .rg-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-bottom: 1px solid var(--theme-border); }
    .rg-modal__title { margin: 0; font-size: 1.15rem; }
    .rg-modal__close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--theme-text-secondary); }
    .rg-modal__body { padding: 1rem; }
    .rg-detail { display: flex; justify-content: space-between; gap: 1rem; padding: 0.3rem 0; border-bottom: 1px solid var(--theme-border); }
    .rg-detail__label { color: var(--theme-text-secondary); }
    .rg-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.3rem; }
    .rg-tag { background: rgba(245,158,11,0.15); color: #92400e; border-radius: 999px; padding: 0.15rem 0.6rem; font-size: 0.85rem; }
    .rg-notes { background: var(--theme-surface-alt, #f3f4f6); border-radius: 8px; padding: 0.6rem 0.75rem; margin-top: 0.3rem; }
    .rg-photos { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
    .rg-photos img { width: 110px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--theme-border); }
    .rg-section-title { font-weight: 600; margin-top: 0.8rem; }
    .rg-sector__head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .rg-sector__title { margin: 0; font-size: 1.05rem; }
    .rg-sector__meta { font-size: 0.85rem; color: var(--theme-text-secondary); font-weight: normal; margin-left: 0.5rem; }
    .rg-group { margin-top: 0.75rem; }
    .rg-group__title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--theme-text-secondary); margin: 0 0 0.25rem; }

    .rg-row { display: grid; grid-template-columns: 2.2rem 1fr auto auto; align-items: center; gap: 0 0.6rem; padding: 0.2rem 0.25rem; line-height: 1.2; border-bottom: 1px solid var(--theme-border, #e5e7eb); }
    .rg-row:last-child { border-bottom: none; }
    .rg-row--reco { background: rgba(var(--theme-accent-rgb, 15,118,110), 0.07); border-radius: 8px; }
    .rg-num { font-weight: 700; color: var(--theme-text-secondary); text-align: right; }
    .rg-name small { color: var(--theme-text-secondary); margin-left: 0.4rem; }
    .rg-main { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.5rem; min-width: 0; }
    .rg-note { font-size: 0.75rem; line-height: 1.15; color: var(--theme-text-secondary); }
    .rg-peek { font-size: 0.75rem; opacity: 0.55; text-decoration: none; }
    .rg-peek:hover { opacity: 1; }
    /* a sector box can be folded to its title bar */
    .rg-fold { background: none; border: 0; padding: 0 0.3rem 0 0; cursor: pointer; font-size: 0.9rem; color: var(--theme-text-secondary); }
    .rg-sector.is-folded .section-card__body { display: none; }
    .rg-sector.is-folded .section-card__header { border-bottom: 0; }
    .rg-note--reco { color: var(--theme-text); }
    .rg-note--reco .rg-up { color: #15803d; font-weight: 600; }
    .rg-note--reco .rg-down { color: #b91c1c; font-weight: 600; }

    /* the status is a plain circle (green open, red closed, grey unknown): no text, the title and aria-label say it */
    .rg-status { width: 1.1rem; height: 1.1rem; min-width: 0; padding: 0; border: 2px solid rgba(0,0,0,0.12); border-radius: 50%; cursor: pointer; flex: none; transition: filter 0.1s, transform 0.1s; }
    .rg-status:hover { transform: scale(1.2); }
    .rg-status:hover { filter: brightness(1.1); }
    .rg-status:disabled { opacity: 0.55; cursor: wait; }
    .rg-status--open { background: #16a34a; }
    .rg-status--closed { background: #dc2626; }
    .rg-status--unknown { background: #6b7280; }

    /* the arrow beside the status: a recommendation to change it (green = open, red = close); clicking it ignores the recommendation */
    .rg-arrow { width: 1.4rem; height: 1.4rem; border-radius: 50%; border: 2px solid; background: #fff; font-size: 0.75rem; line-height: 1; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .rg-arrow--open { color: #16a34a; border-color: #16a34a; }
    .rg-arrow--closed { color: #dc2626; border-color: #dc2626; }
    .rg-arrow:disabled { opacity: 0.5; cursor: wait; }
    .rg-arrow-slot { width: 1.4rem; height: 1.4rem; display: inline-block; }

    .rg-empty { padding: 1.5rem; text-align: center; color: var(--theme-text-secondary); }
    @media (max-width: 640px) {
      .rg-row { grid-template-columns: 2.2rem 1fr auto auto; }
    }
  </style>
</head>
<body data-theme="light" data-module="regis" data-nav="regis" data-page="regis-manage">
  <script src="../js/core/config.js"></script>
  <script src="../js/core/network.js"></script>
  <script src="../js/core/layout.js"></script>
  <!-- Loading -->
  <div id="loading" class="page-loading"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>

  <main id="main-content" class="main" style="display: none;">
    <div class="page-header">
      <div class="page-header__content">
        <h1 class="page-title">🏔️ Régis gère</h1>
      </div>
    </div>

    <section class="content-section">
      <div class="section-card">
        <div class="section-card__body">
          <div class="rg-mountain">
            <div class="rg-counts" id="mountain-counts"></div>
            <div class="rg-tools">
              <div class="rg-filter-box" id="group-filter" aria-label="Afficher"></div>
              <span class="rg-foldall"><button type="button" class="rg-link" id="fold-all">Tout replier</button> · <button type="button" class="rg-link" id="unfold-all">Tout déplier</button></span>
              <label class="rg-filter"><input type="checkbox" id="only-reco"> Seulement les recommandations</label>
              <div class="rg-all"><span>Toute la montagne</span>
                <span class="rg-dots">
                  <button type="button" class="rg-dot rg-dot--closed" id="mountain-close" title="Tout fermer" aria-label="Tout fermer"></button>
                  <button type="button" class="rg-dot rg-dot--open" id="mountain-open" title="Tout ouvrir" aria-label="Tout ouvrir"></button>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="content-section" id="sectors"></section>
    <p class="rg-empty" id="empty" style="display:none;">Aucun sentier à afficher.</p>
  </main>

  <!-- The last inspection of a trail -->
  <div class="rg-modal" id="insp-modal" role="dialog" aria-modal="true" aria-labelledby="insp-title">
    <div class="rg-modal__content">
      <div class="rg-modal__header"><h3 class="rg-modal__title" id="insp-title">-</h3><button type="button" class="rg-modal__close" id="insp-close" aria-label="Fermer">×</button></div>
      <div class="rg-modal__body" id="insp-body"></div>
    </div>
  </div>

  <div id="status-messages"></div>

  <script src="../js/core/utils.js"></script>
  <script src="../js/core/theme.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/firebase-loader.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/services/trail-service.js"></script>
  <script src="../js/services/sector-service.js"></script>
  <script src="../js/services/status-service.js"></script>
  <script>
    // Régis gère - the dashboard of the mountain manager.
    // Every trail and lift of the activity, by sector. The status button switches the status at once (no question asked); the two
    // round buttons beside a sector (and at the top for the whole mountain) close (red) or open (green) everything in it.
    // An inspection never changes a status: it leaves a recommendation (an arrow beside the status). Clicking the status switches
    // it and accepts the recommendation; clicking the arrow ignores it. Both choices, and every change, go to the status log.
    let trails = [];            // the trails and lifts of the activity, not hidden: { id, ...data }
    let sectors = [];           // the activity's sectors, in order
    let lastInspection = {};    // trail id -> its latest inspection of the season
    let busy = false;
    let onlyReco = false;
    let folded = new Set();     // the boxes folded to their title bar ("group|sector"), remembered in this browser
    try { folded = new Set(JSON.parse(localStorage.getItem('regis-folded') || '[]')); } catch (e) { /* no storage: folding just is not remembered */ }
    const saveFolded = () => { try { localStorage.setItem('regis-folded', JSON.stringify([...folded])); } catch (e) { /* ignore */ } };
    let hiddenGroups = {};      // groups the manager hid with the filter (Montées, Descentes)
    let inspectionsById = {};   // this season's inspections by id
    const el = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const STATUS_WORD = { open: 'Ouvert', closed: 'Fermé', unknown: 'Inconnu' };
    // the order of the groups inside a sector
    const KIND_ORDER = ['downhill', 'uphill', 'lift', 'bike'];

    const statusOf = t => StatusService.statusOf(t);
    const recOf = t => StatusService.recommendationOf(t);
    const toDate = v => v && typeof v.toDate === 'function' ? v.toDate() : (v ? new Date(v) : null);
    const day = d => d ? d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' }) : '';
    const agoText = d => {
      if (!d) return '';
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      return days <= 0 ? "aujourd'hui" : days === 1 ? 'hier' : `il y a ${days} j`;
    };

    function sectorOf(trail) {
      return SectorService.find(sectors, trail.sector);
    }
    /** { sectorId or alias: name } for the log */
    function sectorNames() {
      const names = {};
      trails.forEach(t => { const s = sectorOf(t); if (s && t.sector) names[t.sector] = s.name; });
      return names;
    }
    function context(mode, scope) {
      return { user: { uid: currentUser.uid, name: (window.currentUserData && window.currentUserData.name) || currentUser.email || '' },
        app: 'regis', mode, scope: scope || null, network: Network.current(), sectorNames: sectorNames() };
    }

    // ---- loading ----
    async function load() {
      const trailsSnap = await db.collection('trails').get();
      trails = [];
      trailsSnap.forEach(doc => {
        const trail = { id: doc.id, ...doc.data() };
        if (Network.matches(trail) && !TrailService.isArchived(trail)) trails.push(trail);
      });
      sectors = (await SectorService.loadAll(true)).filter(s => s.network === Network.current());
      // the latest inspection of each trail this season (to help decide)
      lastInspection = {};
      inspectionsById = {};
      try {
        const ids = new Set(trails.map(t => t.id));
        const seasonStart = firebase.firestore.Timestamp.fromDate(Network.seasonStart());
        const snap = await db.collection('trail_inspections').where('date', '>=', seasonStart).orderBy('date', 'desc').get();
        snap.forEach(doc => { const d = doc.data(); if (!ids.has(d.trail_id)) return; inspectionsById[doc.id] = { id: doc.id, ...d }; if (!lastInspection[d.trail_id]) lastInspection[d.trail_id] = inspectionsById[doc.id]; });
      } catch (e) { console.warn('Régis gère: the inspections could not be read.', e); }
      render();
    }

    // ---- drawing ----
    const countOf = list => ({
      open: list.filter(t => statusOf(t) === 'open').length,
      closed: list.filter(t => statusOf(t) === 'closed').length,
      unknown: list.filter(t => statusOf(t) === 'unknown').length,
      reco: list.filter(t => recOf(t)).length
    });
    function countsHtml(c) {
      return `<span class="rg-count rg-count--open"><strong>${c.open}</strong> ouverts</span>`
        + `<span class="rg-count rg-count--closed"><strong>${c.closed}</strong> fermés</span>`
        + (c.unknown ? `<span class="rg-count"><strong>${c.unknown}</strong> inconnus</span>` : '')
        + `<span class="rg-count rg-count--reco"><strong>${c.reco}</strong> recommandation${c.reco > 1 ? 's' : ''} à traiter</span>`;
    }

    // The groups of the page: Montées (all the width) on top, Descentes (a box per sector, three per line) in the middle, Remontées
    // (all the width) at the bottom; the bike activity has its trails only. `wide` groups lay the rows of a box side by side.
    function groupDefs() {
      const kinds = (APP_CONFIG.networks[Network.current()] || {}).trailKinds || [];
      if (kinds.includes('bike') && !kinds.includes('uphill') && !kinds.includes('downhill')) return [{ id: 'bike', title: 'Sentiers', kinds: ['bike'] }];
      return [{ id: 'uphill', title: 'Montées', kinds: ['uphill'], wide: true }, { id: 'downhill', title: 'Descentes', kinds: ['downhill'] }, { id: 'lift', title: 'Remontées', kinds: ['lift'], wide: true }];
    }
    const groupOf = t => { const k = TrailService.kindOf(t); return groupDefs().find(g => g.kinds.includes(k)) || groupDefs()[1] || groupDefs()[0]; };
    function rowHtml(t) {
      const status = statusOf(t), rec = recOf(t), insp = inspectionFor(t);
      const isLift = TrailService.kindOf(t) === 'lift';
      // the whole text that describes an inspection is the link to it (it opens the window with the details)
      const asLink = (text, tip) => insp ? `<button type="button" class="rg-link" data-act="inspection" data-id="${esc(t.id)}" title="${esc(tip || "Voir l'inspection")}">${text}</button>` : text;
      const nProblems = n => `${n} problème${n > 1 ? 's' : ''}`;
      // After the name, on the same line when it fits (it wraps under the name otherwise). Only what is worth a look:
      //   - a recommendation (always); - a trail with no inspection this season; - an inspection that is not "good with no issue".
      // A good inspection with nothing to report is just a small magnifier (tooltip: how long ago, the condition), the way in to the window.
      let note = '';
      if (rec) {
        const when = toDate(rec.at) || (insp && toDate(insp.date));
        const detail = [when ? `inspection du ${day(when)}` : '', rec.condition ? TrailService.conditionText(rec.condition) : '', rec.issueCount ? nProblems(rec.issueCount) : ''].filter(Boolean).join(' · ');
        note = `<span class="rg-note rg-note--reco">${asLink((rec.status === 'open' ? '<span class="rg-up">▲ Recommandation : ouvrir</span>' : '<span class="rg-down">▼ Recommandation : fermer</span>') + (detail ? ' (' + esc(detail) + ')' : ''))}</span>`;
      } else if (!isLift) {
        if (!insp) {
          note = '<span class="rg-note">Pas d\'inspection cette saison</span>';
        } else {
          const issues = (insp.issues || []).length;
          const summary = `${agoText(toDate(insp.date))} · ${TrailService.conditionText(insp.condition)}${issues ? ' · ' + nProblems(issues) : ''}`;
          note = (insp.condition === 'good' && !issues)
            ? `<button type="button" class="rg-link rg-peek" data-act="inspection" data-id="${esc(t.id)}" title="Dernière inspection : ${esc(summary)}" aria-label="Dernière inspection : ${esc(summary)}">🔍</button>`
            : `<span class="rg-note">${asLink(esc(summary), 'Voir l\'inspection : ' + summary)}</span>`;
        }
      }
      const arrow = rec
        ? `<button type="button" class="rg-arrow rg-arrow--${rec.status}" data-act="ignore" data-id="${esc(t.id)}" title="${rec.status === 'open' ? 'Une inspection recommande d\'ouvrir' : 'Une inspection recommande de fermer'}. Cliquer pour ignorer la recommandation." aria-label="Ignorer la recommandation">${rec.status === 'open' ? '▲' : '▼'}</button>`
        : '<span class="rg-arrow-slot"></span>';
      return `<div class="rg-row${rec ? ' rg-row--reco' : ''}" data-id="${esc(t.id)}">
        <span class="rg-num">${esc(TrailService.markerLabel(t))}</span>
        <span class="rg-main"><span class="rg-name">${esc(t.name || t.id)}</span>${note}</span>
        ${arrow}
        <button type="button" class="rg-status rg-status--${status}" data-act="toggle" data-id="${esc(t.id)}" title="${STATUS_WORD[status]} - cliquer pour ${status === 'open' ? 'fermer' : 'ouvrir'}" aria-label="${STATUS_WORD[status]} - cliquer pour ${status === 'open' ? 'fermer' : 'ouvrir'}"></button>
      </div>`;
    }
    /** Inside a sector box: the rows (side by side in the full-width groups) */
    function boxBodyHtml(list, group) {
      const rows = list.slice().sort(TrailService.compare).map(rowHtml).join('');
      return group.wide ? `<div class="rg-rows">${rows}</div>` : rows;
    }
    /** The trails of one box: a sector (or '__none') inside a group */
    function boxTrails(groupId, sectorId) {
      return trails.filter(t => groupOf(t).id === groupId && (sectorId === '__none' ? !sectorOf(t) : (sectorOf(t) || {}).id === sectorId));
    }

    function renderFilter() {
      const groups = groupDefs();
      const box = el('group-filter');
      if (groups.length < 2) { box.innerHTML = ''; return; }
      box.innerHTML = groups.map(g => `<label><input type="checkbox" data-group="${g.id}" ${hiddenGroups[g.id] ? '' : 'checked'}> ${esc(g.title)}</label>`).join('');
    }

    function render() {
      const shown = onlyReco ? trails.filter(t => recOf(t)) : trails;
      el('mountain-counts').innerHTML = countsHtml(countOf(trails));
      renderFilter();
      const html = groupDefs().filter(g => !hiddenGroups[g.id]).map(g => {
        // sectors in order, then what has no sector
        const boxes = sectors.map(s => ({ id: s.id, name: s.name })).concat([{ id: '__none', name: 'Sans secteur' }]).map(s => ({
          id: s.id, name: s.name,
          list: shown.filter(t => groupOf(t).id === g.id && (s.id === '__none' ? !sectorOf(t) : (sectorOf(t) || {}).id === s.id))
        })).filter(b => b.list.length);
        if (!boxes.length) return '';
        return `<div class="rg-group-block" data-group="${esc(g.id)}">${groupDefs().length > 1 ? `<h2 class="rg-group-block__title">${esc(g.title)}</h2>` : ''}<div class="rg-grid${g.wide ? ' rg-grid--wide' : ''}">`
          + boxes.map(b => {
            const c = countOf(boxTrails(g.id, b.id));   // a box's buttons act on all of it, even when filtered
            return `<div class="section-card rg-sector${folded.has(g.id + '|' + b.id) ? ' is-folded' : ''}" data-sector="${esc(b.id)}" data-group="${esc(g.id)}">
              <div class="section-card__header rg-sector__head">
                <h3 class="rg-sector__title"><button type="button" class="rg-fold" data-act="fold" data-sector="${esc(b.id)}" data-group="${esc(g.id)}" aria-expanded="${folded.has(g.id + '|' + b.id) ? 'false' : 'true'}" title="${folded.has(g.id + '|' + b.id) ? 'Déplier' : 'Replier'}">${folded.has(g.id + '|' + b.id) ? '▸' : '▾'}</button>${esc(b.name)}<span class="rg-sector__meta">${c.open} ouverts · ${c.closed} fermés${c.unknown ? ' · ' + c.unknown + ' inconnus' : ''}${c.reco ? ' · ▲▼ ' + c.reco : ''}</span></h3>
                <span class="rg-dots">
                  <button type="button" class="rg-dot rg-dot--closed" data-act="sector-closed" data-sector="${esc(b.id)}" data-group="${esc(g.id)}" title="Fermer tout : ${esc(b.name)} (${esc(g.title)})" aria-label="Fermer tout : ${esc(b.name)} (${esc(g.title)})"></button>
                  <button type="button" class="rg-dot rg-dot--open" data-act="sector-open" data-sector="${esc(b.id)}" data-group="${esc(g.id)}" title="Ouvrir tout : ${esc(b.name)} (${esc(g.title)})" aria-label="Ouvrir tout : ${esc(b.name)} (${esc(g.title)})"></button>
                </span>
              </div>
              <div class="section-card__body">${boxBodyHtml(b.list, g)}</div>
            </div>`;
          }).join('') + '</div></div>';
      }).join('');
      el('sectors').innerHTML = html;
      el('empty').style.display = html ? 'none' : '';
      el('empty').textContent = onlyReco ? 'Aucune recommandation à traiter.' : 'Aucun sentier à afficher.';
      document.querySelectorAll('.rg-status, .rg-arrow, .rg-dot').forEach(b => { b.disabled = busy; });
    }

    // ---- the last inspection of a trail, in a window ----
    function inspectionFor(t) {
      const rec = recOf(t);
      return (rec && rec.inspectionId && inspectionsById[rec.inspectionId]) || lastInspection[t.id] || null;
    }
    function openInspection(id) {
      const t = trails.find(x => x.id === id), insp = t && inspectionFor(t);
      if (!insp) return;
      const date = toDate(insp.date);
      const cond = insp.condition || 'unknown';
      const photos = (insp.photos || []).map(p => typeof p === 'string' ? p : (p && p.url)).filter(Boolean);
      el('insp-title').textContent = `${TrailService.markerLabel(t)} · ${t.name || t.id}`;
      el('insp-body').innerHTML =
        `<div class="rg-detail"><span class="rg-detail__label">Date de l'inspection</span><span>${esc(date ? date.toLocaleDateString('fr-CA', { year: 'numeric', month: 'long', day: 'numeric' }) + ' · ' + date.toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' }) : '')}</span></div>`
        + `<div class="rg-detail"><span class="rg-detail__label">Inspecteur</span><span>${esc(insp.inspector_name || 'Non spécifié')}</span></div>`
        + `<div class="rg-detail"><span class="rg-detail__label">État général</span><span>${esc(TrailService.conditionText(cond, true))}</span></div>`
        + (insp.trail_status ? `<div class="rg-detail"><span class="rg-detail__label">Statut recommandé</span><span>${esc(insp.trail_status === 'open' ? 'Ouvrir' : 'Fermer')}</span></div>` : '')
        + (insp.snow_condition ? `<div class="rg-detail"><span class="rg-detail__label">Condition de la neige</span><span>${esc(insp.snow_condition)}</span></div>` : '')
        + (insp.issues && insp.issues.length ? `<div class="rg-section-title">⚠️ Problèmes identifiés</div><div class="rg-tags">${insp.issues.map(i => `<span class="rg-tag">${esc(i)}</span>`).join('')}</div>` : '')
        + (insp.notes && String(insp.notes).trim() ? `<div class="rg-section-title">📝 Notes</div><div class="rg-notes">${esc(insp.notes).replace(/\n/g, '<br>')}</div>` : '')
        + (photos.length ? `<div class="rg-section-title">📷 Photos</div><div class="rg-photos">${photos.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Photo de l'inspection" loading="lazy"></a>`).join('')}</div>` : '');
      el('insp-modal').classList.add('show');
    }
    function closeInspection() { el('insp-modal').classList.remove('show'); }

    // ---- acting ----
    async function run(work) {
      if (busy) return;
      busy = true; render();
      try { await work(); }
      catch (e) { console.error('Régis gère:', e); showMessage('Le changement n\'a pas pu être enregistré : ' + (e.message || e), 'error', 6000); await load().catch(() => {}); }
      finally { busy = false; render(); }
    }
    /** Applies a change to the trails kept in memory (the page does not wait for the next reading) */
    function applyLocal(list, status) {
      list.forEach(t => {
        if (statusOf(t) === status) return;
        t.status = status;
        t.lastUpdated = new Date();
        const rec = t.recommendation;
        if (rec && rec.status === status) t.recommendation = null;
      });
    }
    function changeTrails(list, status, mode, scope) {
      return run(async () => {
        const result = await StatusService.change(db, firebase, list, status, context(mode, scope));
        applyLocal(list, status);
        return result;
      });
    }

    function onClick(e) {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'inspection') { openInspection(btn.dataset.id); return; }
      if (act === 'fold') { const key = btn.dataset.group + '|' + btn.dataset.sector; if (folded.has(key)) folded.delete(key); else folded.add(key); saveFolded(); render(); return; }
      if (busy) return;
      const trail = trails.find(t => t.id === btn.dataset.id);
      if (act === 'toggle' && trail) {
        changeTrails([trail], statusOf(trail) === 'open' ? 'closed' : 'open', 'individual', null);
      } else if (act === 'ignore' && trail) {
        run(async () => {
          await StatusService.ignore(db, firebase, trail, context('individual', null));
          trail.recommendation = null;
        });
      } else if (act === 'sector-open' || act === 'sector-closed') {
        const id = btn.dataset.sector;
        const name = id === '__none' ? 'Sans secteur' : (sectors.find(s => s.id === id) || {}).name;
        changeTrails(boxTrails(btn.dataset.group, id), act === 'sector-open' ? 'open' : 'closed', 'sector', name);
      }
    }
    function mountainAll(status) {
      const word = status === 'open' ? 'ouvrir' : 'fermer';
      if (!confirm(`Voulez-vous vraiment ${word} toute la montagne (${trails.length} pistes, montées et remontées) ?`)) return;
      changeTrails(trails, status, 'mountain', null);
    }

    function initRegis() {
      el('sectors').addEventListener('click', onClick);
      el('mountain-open').addEventListener('click', () => mountainAll('open'));
      el('mountain-close').addEventListener('click', () => mountainAll('closed'));
      el('fold-all').addEventListener('click', () => { document.querySelectorAll('.rg-sector').forEach(b => folded.add(b.dataset.group + '|' + b.dataset.sector)); saveFolded(); render(); });
      el('unfold-all').addEventListener('click', () => { folded.clear(); saveFolded(); render(); });
      el('only-reco').addEventListener('change', e => { onlyReco = e.target.checked; render(); });
      el('group-filter').addEventListener('change', e => { const g = e.target.dataset.group; if (g) { hiddenGroups[g] = !e.target.checked; render(); } });
      el('insp-close').addEventListener('click', closeInspection);
      el('insp-modal').addEventListener('click', e => { if (e.target.id === 'insp-modal') closeInspection(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeInspection(); });
      checkAuthStatus({
        requireAuth: true,
        requiredPermission: 'allowRegis',
        permissionDefault: false,
        onAuthenticated: async () => {
          await load();
          // other people may change statuses or inspect meanwhile: read again every minute while the page is on screen
          setInterval(() => { if (!busy && !document.hidden) load().catch(() => {}); }, 60000);
        }
      });
    }

    onFirebaseReady(initRegis);
  </script>
</body>
</html>
